<style>
/* One stage. A strip of scenario chips on top, the explainer below, the wallet lands in the empty right third.
   Mock of docs/plan/demo-page/explainer-spec.md. Static data; nothing here talks to a chain. */
body { min-height: 100vh; background:
  radial-gradient(circle at 1px 1px, var(--ink-700) 1px, transparent 1.5px) 0 0 / var(--grid) var(--grid), var(--ink-900); }
.top { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; }
.top .brand { display: flex; align-items: baseline; gap: 14px; }
.top .wordmark { font-size: 22px; }
.top .label { margin-left: 4px; }
.top .acts { display: flex; gap: 10px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 6px 32px 18px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group .label { font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 13px/1 var(--body); color: var(--paper-200); background: var(--ink-800); border: var(--hair); border-radius: var(--r); padding: 9px 12px; cursor: pointer; white-space: nowrap; transition: border-color 150ms, color 150ms; }
.chip:hover { border-color: var(--ink-600); color: var(--paper-100); }
.chip.on { color: var(--ink-900); background: var(--paper-100); border-color: var(--paper-100); }
.chip .tag { font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-400); margin-left: 8px; }
.chip.on .tag { color: var(--ink-600); }

.stage { position: relative; margin: 0 32px 32px; min-height: 620px; background: var(--ink-800); border: var(--hair); border-radius: var(--r);
  display: grid; grid-template-columns: 30% 1fr 27%; padding: 36px 40px; gap: 56px; overflow: hidden; }
.stage svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.stage .wire { fill: none; stroke: var(--ink-600); stroke-width: 1.5; stroke-dasharray: 900; stroke-dashoffset: 900; transition: stroke-dashoffset 400ms var(--ease-out); }
.stage .wire.heavy { stroke: var(--paper-200); stroke-width: 2.5; }
.stage .wire.drawn { stroke-dashoffset: 0; }
.stage .wire.struck { stroke: var(--ink-700); stroke-dasharray: 6 6; }
.col { position: relative; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.in { opacity: 0; transform: translateY(var(--enter-rise)); transition: opacity var(--enter) var(--ease-out), transform var(--enter) var(--ease-out); }
.in.on { opacity: 1; transform: none; }

/* the lists the wallet follows */
.list { border: var(--hair); border-radius: var(--r); padding: 12px 14px; background: var(--ink-900); }
.list .name { font: 500 14px/1.2 var(--mono); color: var(--paper-100); }
.list .role { font-size: 13px; color: var(--ink-400); margin-top: 3px; }
.writers { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.writer { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.pill { font: 500 12px/1 var(--mono); color: var(--paper-200); border: var(--hair-strong); border-radius: var(--r); padding: 7px 9px; white-space: nowrap; background: var(--ink-800); }
.pill .w { color: var(--ink-400); margin-left: 6px; }
.says { font-size: 14px; line-height: 1.4; color: var(--paper-200); opacity: 0; transition: opacity var(--enter) var(--ease-out); padding-top: 4px; }
.says.on { opacity: 1; }
.says b { color: var(--paper-100); font-weight: 500; }
.says .mono { font-family: var(--mono); font-size: 12px; color: var(--ink-400); }
.says.struck { text-decoration: line-through; color: var(--ink-400); }
.seq { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.seq span { font: 500 12px/1 var(--mono); color: var(--paper-200); border: var(--hair-strong); border-radius: var(--r); padding: 6px 8px; }
.seq span.gap { color: var(--alert); border-color: var(--alert); }

/* the subject and the verdict */
.mid { justify-content: flex-start; align-items: flex-start; padding-top: 6px; }
.ctx { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-400); }
.subject { background: var(--paper-100); color: var(--ink-900); border-radius: var(--r); padding: 16px 18px; width: 100%; box-sizing: border-box; }
.subject .lab { font: 700 22px/1.1 var(--display); letter-spacing: -0.02em; }
.subject .addr { font: 400 12px/1.4 var(--mono); color: var(--ink-600); margin-top: 6px; word-break: break-all; }
.subject .cat { display: inline-block; margin-top: 10px; font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--paper-100); background: var(--ink-900); padding: 6px 8px; border-radius: var(--r); }
.subject.second { background: var(--ink-900); color: var(--paper-100); border: var(--hair-strong); }
.subject.second .lab { font-size: 16px; } .subject.second .addr { color: var(--ink-400); }
.count { font: 400 15px/1.4 var(--body); color: var(--paper-200); }
.count b { font-family: var(--mono); color: var(--paper-100); font-weight: 500; }
.rule { font-size: 18px; line-height: 1.4; color: var(--paper-100); }
.verdict { position: relative; font: 700 64px/1 var(--display); letter-spacing: -0.03em; color: var(--paper-100); margin-top: 6px; }
.verdict.warn { text-decoration: underline; text-decoration-color: var(--signal); text-decoration-thickness: 4px; text-underline-offset: 8px; }
.verdict.block { color: var(--alert); }
.verdict.unverifiable { color: var(--signal); font-size: 52px; }
.ring { position: absolute; left: 0; top: 50%; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--paper-200); transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
.ring.go { animation: ring 1.6s var(--ease-out) forwards; }
.verdict.block .ring { border-color: var(--alert); }
.verdict.unverifiable .ring { border-color: var(--signal); }
@keyframes ring { 0% { opacity: .9; width: 10px; height: 10px; } 100% { opacity: 0; width: 900px; height: 900px; } }
.foot { font: 400 12px/1.5 var(--mono); color: var(--ink-400); margin-top: 4px; }
.foot a { color: var(--paper-200); border-bottom: 1px solid var(--ink-600); }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.copy { display: flex; gap: 8px; align-items: center; font: 400 12px/1 var(--mono); color: var(--paper-200); border: var(--hair); border-radius: var(--r); padding: 8px 10px; }
.copy small { color: var(--ink-400); font-family: var(--body); }

/* the right third: kept empty for the wallet */
.land { position: relative; border: 1px dashed var(--ink-600); border-radius: var(--r); height: 100%; min-height: 520px; display: grid; place-items: center; opacity: 0; transition: opacity var(--state); }
.land.on { opacity: 1; }
.land .label { text-align: center; line-height: 1.6; }
.land .arrow { position: absolute; left: -46px; top: 42%; width: 36px; height: 1.5px; background: var(--ink-400); }
.land .arrow::after { content: ''; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left-color: var(--ink-400); }
.land .fakewallet { position: absolute; inset: 12px; background: #24272a; border-radius: 10px; opacity: 0; transition: opacity var(--state); display: flex; flex-direction: column; padding: 14px; gap: 10px; color: #d6d9dc; font: 400 12px/1.4 system-ui, sans-serif; }
.land .fakewallet.on { opacity: 1; }
.fakewallet .bar { display: flex; justify-content: space-between; color: #9fa6ad; font-size: 11px; }
.fakewallet .block { border-top: 4px solid #d73847; background: #2e2a2b; border-radius: 6px; padding: 12px; }
.fakewallet .warnb { border-top: 4px solid #f0b90b; background: #2f2c25; border-radius: 6px; padding: 12px; }
.fakewallet .cleanb { border-top: 4px solid #4a5056; background: #2b2e31; border-radius: 6px; padding: 12px; }
.fakewallet h4 { margin: 0 0 4px; font-size: 14px; }
.fakewallet .btns { margin-top: auto; display: flex; gap: 8px; }
.fakewallet .btns span { flex: 1; text-align: center; padding: 10px; border-radius: 20px; border: 1px solid #4a5056; }
.fakewallet .btns span.p { background: #4459ff; border-color: #4459ff; color: #fff; }
.hint { position: absolute; right: 40px; bottom: 14px; font: 400 11px/1 var(--mono); color: var(--ink-400); letter-spacing: .04em; }
@media (prefers-reduced-motion: reduce) { .in, .says, .wire, .land { transition: none; } .ring.go { animation: none; } }
</style>

<body>
<header class="top">
  <div class="brand"><span class="wordmark">tocsin</span><span class="label">demo · sepolia</span></div>
  <div class="acts"><button class="btn" id="host">0xE0DF…3cca · MetaMask + Tocsin Snap</button><button class="btn">Install Snap</button></div>
</header>
<nav class="chip-row" id="chips" aria-label="scenarios"></nav>
<main class="stage" id="stage" aria-live="polite">
  <svg class="wires" id="wires"></svg>
  <section class="col" id="lists"></section>
  <section class="col mid" id="mid"></section>
  <section class="col"><div class="land" id="land"><span class="arrow"></span><div class="label">wallet opens here<br>nothing you need to read is under it</div><div class="fakewallet" id="fw"></div></div></section>
  <span class="hint">← → scenario · R replay · click stage to skip · Enter send</span>
</main>
<script>
// ---- data: in the real page this is utils/demo/scenarios.ts plus a LISTS constant, pinned to the tsv by a test
const LISTS = [
  { name: 'core.tocsin.eth', role: 'us: the core writer and the detector agent, one operator', blocking: true, writers: [
    { id: 'manual', label: 'core', w: 255 }, { id: 'detector', label: 'detector', w: 1 } ] },
  { name: 'blockaid.tocsin.eth', role: 'a security vendor, claimed by the owner of blockaid.eth', blocking: true, writers: [ { id: 'harbor', label: 'blockaid', w: 255 } ] },
  { name: 'scamsniffer.tocsin.eth', role: 'phishing researchers, claimed by the owner of scamsniffer.eth', blocking: true, writers: [ { id: 'lantern', label: 'scamsniffer', w: 1 } ] },
];
const WARN_ONLY = new Set(['THEFT_PROCEEDS']);
const S = [
  { id: 'clean', group: 'Send ETH', title: 'Clean send', ctx: 'recipient', subject: { label: 'demo account', addr: '0xE0DFbd2B761929D02b30f2173C3386f0ec4B3cca' }, cat: null, flags: [] },
  { id: 'op', group: 'Send ETH', title: 'Poisoning operator', ctx: 'recipient', subject: { label: 'poisoning-operator-1', addr: '0x5126633bCFdb9E4A2FE7AB445394AE0a217f9120' }, cat: 'POISONING_OPERATOR',
    flags: [ { writer: 'detector', ev: '0x3725c75c…5af9dce' }, { writer: 'lantern', ev: '0xa84cc88a…0becb16' } ] },
  { id: 'drainer', group: 'Send ETH', title: 'Drainer receiver', ctx: 'recipient', subject: { label: 'drainer-receiver-1', addr: '0x79fDaE13B1A677E5b8Ac9f5411F6664788A17537' }, cat: 'DRAINER_RECEIVER',
    flags: [ { writer: 'manual', ev: '0x0b1c…a91f' }, { writer: 'harbor', ev: '0x3725c75c…5af9dce' }, { writer: 'lantern', ev: '0xa84cc88a…0becb16' } ] },
  { id: 'poison', group: 'Send ETH', title: 'Drainer receiver, lying RPC', tag: 'beat 2', ctx: 'recipient', poison: true, subject: { label: 'drainer-receiver-1', addr: '0x79fDaE13B1A677E5b8Ac9f5411F6664788A17537' }, cat: 'DRAINER_RECEIVER',
    flags: [ { writer: 'manual', ev: '0x0b1c…a91f' }, { writer: 'harbor', ev: '0x3725c75c…5af9dce' }, { writer: 'lantern', ev: '0xa84cc88a…0becb16' } ] },
  { id: 'lantern', group: 'Send ETH', title: 'Scamsniffer-only operator', ctx: 'recipient', subject: { label: 'sniffer-poisoning-operator-1', addr: '0xd59557f9a8f3574f58FDc8ea63E4f9B1F7486B22' }, cat: 'POISONING_OPERATOR',
    flags: [ { writer: 'lantern', ev: '0xa84cc88a…0becb16' } ], after: 'Set the Snap policy to 1 writer and this blocks.' },
  { id: 'theft', group: 'Send ETH', title: 'Theft proceeds', ctx: 'recipient', subject: { label: 'theft-proceeds-1', addr: '0x8e1a…c0de' }, cat: 'THEFT_PROCEEDS', flags: [ { writer: 'manual', ev: '0x0b1c…a91f' } ] },
  { id: 'retracted', group: 'Send ETH', title: 'Retracted lookalike', ctx: 'recipient', subject: { label: 'paid-lookalike-retracted', addr: '0x44aa…9e2b' }, cat: 'PAID_LOOKALIKE', flags: [ { writer: 'manual', ev: '0x0b1c…a91f', tomb: true } ] },
  { id: 'token', group: 'Send token', title: 'fakeUSDC to a clean address', tag: 'snap only', ctx: 'token', subject: { label: 'fakeUSDC, the contract itself', addr: '0x2Ba2B2F4bd18D04C3bA92DB9F73a49d19c87b4B8' }, cat: 'FAKE_TOKEN', flags: [ { writer: 'manual', ev: '0x0b1c…a91f' } ] },
  { id: 'approve', group: 'Approve', title: 'realUSDC to a drainer spender', ctx: 'spender', subject: { label: 'drainer-spender-1', addr: '0x7d77cf49d8c1851781C3cEfCdD9Bd9871366782e' }, cat: 'DRAINER_SPENDER', flags: [ { writer: 'manual', ev: '0x0b1c…a91f' }, { writer: 'harbor', ev: '0x3725c75c…5af9dce' } ] },
  { id: 'swap', group: 'Swap', title: 'Swap, recipient drainer', ctx: 'recipient', via: { label: 'SwapRouter02', addr: '0x3bFA4769FB09eefC5a80d6E87c3B9C650f7Ae48E' }, subject: { label: 'drainer-receiver-1', addr: '0x79fDaE13B1A677E5b8Ac9f5411F6664788A17537' }, cat: 'DRAINER_RECEIVER',
    flags: [ { writer: 'manual', ev: '0x0b1c…a91f' }, { writer: 'harbor', ev: '0x3725c75c…5af9dce' }, { writer: 'lantern', ev: '0xa84cc88a…0becb16' } ] },
];
const CTX = { recipient: 'recipient of your send', spender: 'spender of your allowance', token: 'the token contract you are calling' };

// ---- explain(): presentation copy of the reader's rules. Must agree with the scenario table (tested in the real page).
function explain(sc, threshold = 2) {
  const perList = LISTS.map(L => {
    const live = sc.flags.filter(f => !f.tomb && L.writers.some(w => w.id === f.writer));
    const weights = live.map(f => L.writers.find(w => w.id === f.writer).w);
    const independent = live.length ? 1 : 0; // one list = one operator in this demo
    let v = 'clean';
    if (weights.includes(255)) v = 'block'; else if (independent >= threshold) v = 'block'; else if (live.length) v = 'warn';
    return { L, live, weights, independent, v };
  });
  const rank = { clean: 0, warn: 1, block: 2 };
  let verdict = perList.reduce((a, p) => rank[p.v] > rank[a] ? p.v : a, 'clean');
  let rule;
  const flagged = perList.filter(p => p.live.length);
  if (sc.poison) rule = 'The RPC left out the writer’s first entry. The replayed fold does not reach the head Ethereum proves. Nothing it says can be trusted, so the wallet refuses to call this clean.';
  else if (!flagged.length && sc.flags.some(f => f.tomb)) rule = 'The writer retracted its own flag with a tombstone. The log keeps both entries; the wallet counts neither.';
  else if (!flagged.length) rule = 'No list you follow has a flag on this address.';
  else if (verdict === 'block' && flagged.some(p => p.weights.includes(255))) rule = `${flagged.filter(p => p.weights.includes(255)).map(p => p.L.name).join(' and ')} ${flagged.filter(p => p.weights.includes(255)).length > 1 ? 'carry' : 'carries'} this writer at weight 255. One such writer blocks on its own.`;
  else if (verdict === 'block') rule = 'Two independent writers on one list reach the threshold. That blocks.';
  else rule = flagged.length > 1 ? 'Each list has one writer at weight 1. One writer warns. Two lists do not add up to a block.' : `One writer at weight 1 warns. ${sc.after ?? ''}`;
  if (verdict === 'block' && WARN_ONLY.has(sc.cat)) { verdict = 'warn'; rule = 'A weight-255 writer would block, but this category warns and never blocks a send: the money is already stolen, the wallet only tells you where it is going.'; }
  if (sc.poison) verdict = 'unverifiable';
  return { perList, verdict, rule };
}

// ---- stage
const $ = id => document.getElementById(id);
let cur = 0, timers = [], final = false;
const sched = (fn, t) => timers.push(setTimeout(fn, t));
const stop = () => { timers.forEach(clearTimeout); timers = []; };
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function chips() {
  const groups = [...new Set(S.map(s => s.group))];
  for (const g of groups) {
    const box = el('div', 'group'); box.append(el('span', 'label', g)); const row = el('div', 'chips');
    S.forEach((s, i) => { if (s.group !== g) return; const c = el('button', 'chip', s.title + (s.tag ? `<span class="tag">${s.tag}</span>` : '')); c.dataset.i = i; c.onclick = () => play(i); row.append(c); });
    box.append(row); $('chips').append(box);
  }
}
function wire(fromEl, toEl, cls) {
  const st = $('stage').getBoundingClientRect(), a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect(), card = fromEl.closest('.list').getBoundingClientRect();
  const x1 = card.right - st.left, y1 = a.top + a.height / 2 - st.top, x2 = b.left - st.left, y2 = b.top + b.height / 2 - st.top, c = Math.max(28, (x2 - x1) / 2);
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`); p.setAttribute('class', 'wire ' + (cls || ''));
  $('wires').append(p); requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add('drawn'))); return p;
}

function play(i) {
  stop(); final = false; cur = i; const sc = S[i], ex = explain(sc);
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', +c.dataset.i === i));
  $('wires').innerHTML = ''; $('lists').innerHTML = ''; $('mid').innerHTML = ''; $('land').classList.remove('on'); $('fw').classList.remove('on');
  let t = 0;
  // 1. the subject
  const ctx = el('div', 'ctx in', CTX[sc.ctx]); $('mid').append(ctx);
  if (sc.via) { const v = el('div', 'subject second in', `<div class="lab">${sc.via.label}</div><div class="addr">${sc.via.addr}</div><div class="foot">the decoder reads through the swap to its recipient</div>`); $('mid').append(v); }
  const sub = el('div', 'subject in', `<div class="lab">${sc.subject.label}</div><div class="addr">${sc.subject.addr}</div>${sc.cat ? `<span class="cat">${sc.cat}</span>` : ''}`); $('mid').append(sub);
  sched(() => $('mid').querySelectorAll('.in').forEach(e => e.classList.add('on')), t += 60);
  // 2. the lists the wallet follows
  const nodes = {};
  LISTS.forEach((L, k) => {
    const card = el('div', 'list in', `<div class="name">${L.name}</div><div class="role">${L.role}</div>`); const ws = el('div', 'writers');
    L.writers.forEach(w => { const row = el('div', 'writer'); const pill = el('span', 'pill', `${w.label}<span class="w">w${w.w}</span>`); const says = el('div', 'says'); row.append(pill, says); ws.append(row); nodes[w.id] = { pill, says }; });
    card.append(ws); $('lists').append(card); sched(() => card.classList.add('on'), t + 380 + k * 120);
  });
  t += 900;
  // 3a. the lying RPC: the fold breaks before any flag is read
  if (sc.poison) {
    const seq = el('div', 'seq'); for (let n = 1; n <= 8; n++) seq.append(el('span', '', n === 1 ? '?' : String(n)));
    sched(() => { $('lists').firstChild.append(seq); }, t);
    sched(() => { seq.children[0].classList.add('gap'); nodes.manual.says.innerHTML = `<b>sequence 1 is missing</b> from what this RPC returned. Replaying the fold gives a head that does not match the one proven from the block header.`; nodes.manual.says.classList.add('on'); }, t += 900);
    t += 700;
  } else {
    // 3b. who flagged it, and what they said
    sc.flags.forEach(f => {
      const L = LISTS.find(l => l.writers.some(w => w.id === f.writer)), w = L.writers.find(w => w.id === f.writer);
      sched(() => {
        const p = wire(nodes[f.writer].pill, sub, w.w === 255 ? 'heavy' : '');
        nodes[f.writer].says.innerHTML = `<b>${L.name}</b> flagged it: ${sc.cat}, weight ${w.w}. <span class="mono">evidence <a>${f.ev}</a></span>`; nodes[f.writer].says.classList.add('on');
        if (f.tomb) sched(() => { p.classList.add('struck'); nodes[f.writer].says.classList.add('struck'); nodes[f.writer].says.insertAdjacentHTML('beforeend', ' <b style="text-decoration:none;display:inline-block">then retracted it</b>'); }, 700);
      }, t); t += 480;
    });
    if (f => sc.flags.length) t += sc.flags.some(f => f.tomb) ? 600 : 0;
  }
  // 4. the count and the rule
  const flagged = ex.perList.filter(p => p.live.length);
  if (flagged.length && !sc.poison) {
    const c = el('div', 'count in', `independent writers: <b>${flagged.length}</b>${flagged.some(p => p.live.length > 1) ? ' <span style="color:var(--ink-400)">(the core writer and the detector share one operator and count once)</span>' : ''} · lists that flag it: <b>${flagged.length}</b> of ${LISTS.length}`);
    sched(() => { $('mid').append(c); requestAnimationFrame(() => c.classList.add('on')); }, t); t += 500;
  }
  const rule = el('div', 'rule in', ex.rule); sched(() => { $('mid').append(rule); requestAnimationFrame(() => rule.classList.add('on')); }, t); t += 650;
  // 5. the verdict, one ripple
  const word = { clean: 'Clean', warn: 'Warn', block: 'Blocked', unverifiable: 'Unverifiable' }[ex.verdict];
  const v = el('div', `verdict in ${ex.verdict}`, `${word}<span class="ring"></span>`); sched(() => { $('mid').append(v); requestAnimationFrame(() => { v.classList.add('on'); if (ex.verdict !== 'clean') v.querySelector('.ring').classList.add('go'); }); }, t); t += 500;
  // 6. handoff
  sched(() => finish(sc, ex), t);
}
function finish(sc, ex) {
  final = true;
  const mid = $('mid');
  if (!mid.querySelector('.actions')) {
    const foot = el('div', 'foot in', `the wallet should say this. The stage is drawn from the seed table; the wallet checks the chain itself.`);
    const acts = el('div', 'actions in'); // amber once per screen: the verdict word already took it in the unverifiable case
    const send = el('button', `btn ${ex.verdict === 'warn' || ex.verdict === 'block' ? 'signal' : 'primary'}`, 'Send it to the wallet'); send.onclick = sendIt; acts.append(send);
    if (sc.poison) acts.append(el('span', 'copy', `http://127.0.0.1:8550 <button class="btn" style="padding:4px 8px;font-size:11px">copy</button><small>paste into the Snap RPC setting first</small>`));
    if (sc.tag === 'snap only') acts.append(el('span', 'copy', `<small>Snap only until Kohaku lands token checks</small>`));
    mid.append(foot, acts); requestAnimationFrame(() => { foot.classList.add('on'); acts.classList.add('on'); });
  }
  $('land').classList.add('on');
}
function sendIt() {
  const ex = explain(S[cur]), fw = $('fw');
  const body = { block: `<div class="block"><h4>Blocked by Tocsin</h4>${S[cur].subject.label} is flagged as ${S[cur].cat} by ${ex.perList.filter(p => p.live.length).map(p => p.L.name).join(', ')}. The chain proves each flag is the writer’s own entry.</div>`,
    warn: `<div class="warnb"><h4>Tocsin warns</h4>${S[cur].subject.label} is flagged as ${S[cur].cat} by one writer at weight 1.</div>`,
    clean: `<div class="cleanb"><h4>Tocsin</h4>No list you follow flags this address. Head verified at block 12,077,4xx.</div>`,
    unverifiable: `<div class="warnb"><h4>Unverifiable</h4>Chain mismatch at sequence 1. The RPC’s data does not match the head Ethereum proves. Never clean.</div>` }[ex.verdict];
  fw.innerHTML = `<div class="bar"><span>MetaMask</span><span>Sepolia</span></div><div style="font-size:13px">Send 0.00001 ETH to <span style="font-family:var(--mono)">${S[cur].subject.addr.slice(0, 10)}…</span></div>${body}<div class="btns"><span>Reject</span><span class="p">Confirm</span></div>`;
  fw.classList.add('on');
}
function skip() { if (final) return; stop(); document.querySelectorAll('#stage .in, #stage .says').forEach(e => e.classList.add('on')); document.querySelectorAll('.wire').forEach(w => w.classList.add('drawn')); const sc = S[cur]; finish(sc, explain(sc)); }
$('stage').addEventListener('click', e => { if (e.target.closest('button, a')) return; skip(); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') play(Math.min(S.length - 1, cur + 1));
  if (e.key === 'ArrowLeft') play(Math.max(0, cur - 1));
  if (e.key.toLowerCase() === 'r') play(cur);
  if (e.key === 'Enter') { if (!final) skip(); else sendIt(); }
  if (e.key.toLowerCase() === 'p') document.body.classList.toggle('present');
});
chips(); play(2);
</script>
